                    }
                    const numMatch = trimmed.match(/^(\d+)\.\s*(.*)/);
                    currentPhraseObj = {
                        id: numMatch ? parseInt(numMatch[1]) : phrases.length + 1,
                        category: currentCat,
                        es: numMatch ? numMatch[2] : trimmed,
                        en: '',
                        note: ''
                    };
                } else if (trimmed.startsWith('»')) {
                    if (currentPhraseObj) {
                        currentPhraseObj.note += (currentPhraseObj.note ? ' ' : '') + trimmed.substring(1).trim();
                    }
                } else {
                    if (currentPhraseObj && !currentPhraseObj.en) {
                        currentPhraseObj.en = trimmed;
                    }
                }
            });
            if (currentPhraseObj) {
                phrases.push(currentPhraseObj);
            }

            filteredPhrases = [...phrases];
        }

        // Load TTS Voices
        function loadVoices() {
            voices = synth.getVoices();
            const voiceSelect = document.getElementById('voiceSelect');
            voiceSelect.innerHTML = '';

            // Prioritize es-AR, es-CL, es-UY, or Spanish
            const esVoices = voices.filter(v => v.lang.startsWith('es'));
            let arVoice = voices.find(v => v.lang === 'es-AR') || 
                          voices.find(v => v.lang === 'es-UY') ||
                          voices.find(v => v.lang.includes('es'));

            if (voices.length === 0) {
                voiceSelect.innerHTML = '<option>找不到 TTS 語音 (瀏覽器不支援)</option>';
                return;
            }

            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                let isAR = voice.lang === 'es-AR' ? ' (🇦🇷 阿根廷口音)' : '';
                option.textContent = `${voice.name} (${voice.lang})${isAR}`;
                if (voice === arVoice) {
                    option.selected = true;
                    selectedVoice = voice;
                }
                voiceSelect.appendChild(option);
            });

            if (!selectedVoice && voices.length > 0) {
                selectedVoice = voices[0];
            }
        }

        // Render UI
        function renderCategories() {
            const catContainer = document.getElementById('categoryList');
            catContainer.innerHTML = '';

            // All Category
            const allBtn = document.createElement('button');
            allBtn.className = `w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition flex justify-between items-center bg-sky-50 text-sky-700 font-bold`;
            allBtn.innerHTML = `<span>全部主題 (601-1000)</span> <span class="bg-sky-200 text-sky-800 px-1.5 py-0.5 rounded-full text-[10px]">${phrases.length}</span>`;
            allBtn.onclick = () => filterCategory('ALL', allBtn);
            catContainer.appendChild(allBtn);

            categories.forEach(cat => {
                const count = phrases.filter(p => p.category === cat).length;
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-100 transition flex justify-between items-center`;
                btn.innerHTML = `<span>${cat}</span> <span class="bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded-full text-[10px]">${count}</span>`;
                btn.onclick = () => filterCategory(cat, btn);
                catContainer.appendChild(btn);
            });
        }

        function filterCategory(cat, btnElement) {
            document.querySelectorAll('#categoryList button').forEach(b => {
                b.className = `w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-100 transition flex justify-between items-center`;
            });
            btnElement.className = `w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition flex justify-between items-center bg-sky-50 text-sky-700 font-bold`;

            if (cat === 'ALL') {
                filteredPhrases = [...phrases];
            } else {
                filteredPhrases = phrases.filter(p => p.category === cat);
            }
            renderPhrases();
        }

        function renderPhrases() {
            const list = document.getElementById('phraseList');
            document.getElementById('countDisplay').textContent = filteredPhrases.length;
            list.innerHTML = '';

            filteredPhrases.forEach((p, idx) => {
                const card = document.createElement('div');
                const isSelected = filteredPhrases[currentIdx] && filteredPhrases[currentIdx].id === p.id;
                card.className = `p-4 rounded-xl border border-slate-200 hover:border-sky-300 transition cursor-pointer bg-white relative ${isSelected ? 'active-phrase' : ''}`;
                card.id = `phrase-card-${idx}`;
                card.onclick = () => playPhraseAtIndex(idx);

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-500">#${p.id}</span>
                                <span class="text-[10px] text-sky-600 font-medium">${p.category}</span>
                            </div>
                            <h3 class="text-base font-semibold text-slate-800 leading-snug">${p.es}</h3>
                            <p class="text-sm text-slate-600 mt-1">${p.en}</p>
                            ${p.note ? `<p class="text-xs text-amber-700 bg-amber-50 rounded px-2 py-1 mt-2 inline-block border border-amber-200/60"><i class="fas fa-lightbulb me-1"></i>${p.note}</p>` : ''}
                        </div>
                        <button class="p-2 text-sky-600 hover:bg-sky-50 rounded-full transition" title="朗讀">
                            <i class="fas ${isSelected && isPlaying ? 'fa-volume-high text-sky-600 animate-pulse' : 'fa-volume-low text-slate-400'} text-lg"></i>
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function updatePlayerUI() {
            const current = filteredPhrases[currentIdx];
            if (!current) return;

            document.getElementById('currentCategory').textContent = `#${current.id} · ${current.category}`;
            document.getElementById('currentEs').textContent = current.es;
            document.getElementById('currentEn').textContent = current.en;

            // Highlight Active Card
            document.querySelectorAll('#phraseList > div').forEach((el, idx) => {
                if (idx === currentIdx) {
                    el.classList.add('active-phrase');
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    el.classList.remove('active-phrase');
                }
            });

            // Update Play Icon
            const playIcon = document.getElementById('playIcon');
            if (isPlaying) {
                playIcon.className = 'fas fa-pause text-lg';
            } else {
                playIcon.className = 'fas fa-play text-lg';
            }
        }

        // Speech Logic
        function playPhraseAtIndex(index) {
            if (index < 0 || index >= filteredPhrases.length) return;
            currentIdx = index;
            isPlaying = true;
            updatePlayerUI();

            synth.cancel(); // Stop current speech

            const phrase = filteredPhrases[currentIdx];
            const rate = parseFloat(document.getElementById('rateInput').value);

            // Spanish Utterance
            const utterEs = new SpeechSynthesisUtterance(phrase.es);
            utterEs.rate = rate;
            if (selectedVoice) {
                utterEs.voice = selectedVoice;
            } else {
                utterEs.lang = 'es-AR';
            }

            utterEs.onend = () => {
                const readEn = document.getElementById('readEnToggle').checked;
                if (readEn) {
                    const utterEn = new SpeechSynthesisUtterance(phrase.en);
                    utterEn.lang = 'en-US';
                    utterEn.rate = rate;
                    utterEn.onend = checkAutoPlayNext;
                    synth.speak(utterEn);
                } else {
                    checkAutoPlayNext();
                }
            };

            utterEs.onerror = () => {
                isPlaying = false;
                updatePlayerUI();
            };

            synth.speak(utterEs);
        }

        function checkAutoPlayNext() {
            const autoPlay = document.getElementById('autoPlayToggle').checked;
            if (autoPlay && isPlaying) {
                if (currentIdx + 1 < filteredPhrases.length) {
                    setTimeout(() => {
                        playPhraseAtIndex(currentIdx + 1);
                    }, 500);
                } else {
                    isPlaying = false;
                    updatePlayerUI();
                }
            } else {
                isPlaying = false;
                updatePlayerUI();
            }
        }

        function togglePlayPause() {
            if (isPlaying) {
                synth.cancel();
                isPlaying = false;
                updatePlayerUI();
            } else {
                playPhraseAtIndex(currentIdx);
            }
        }

        // Event Listeners
        document.getElementById('playPauseBtn').onclick = togglePlayPause;
        document.getElementById('prevBtn').onclick = () => {
            if (currentIdx > 0) playPhraseAtIndex(currentIdx - 1);
        };
        document.getElementById('nextBtn').onclick = () => {
            if (currentIdx + 1 < filteredPhrases.length) playPhraseAtIndex(currentIdx + 1);
        };

        document.getElementById('rateInput').oninput = (e) => {
            document.getElementById('rateValue').textContent = `${e.target.value}x`;
        };

        document.getElementById('voiceSelect').onchange = (e) => {
            selectedVoice = voices[e.target.value];
        };

        document.getElementById('searchInput').oninput = (e) => {
            const query = e.target.value.toLowerCase().trim();
            filteredPhrases = phrases.filter(p => 
                p.es.toLowerCase().includes(query) || 
                p.en.toLowerCase().includes(query) || 
                p.note.toLowerCase().includes(query)
            );
            currentIdx = 0;
            renderPhrases();
            updatePlayerUI();
        };

        // Initialize
        window.onload = () => {
            parseData();
            renderCategories();
            renderPhrases();

            loadVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = loadVoices;
            }

            if (filteredPhrases.length > 0) {
                updatePlayerUI();
            }
        };
    </script>
</body>
</html>
